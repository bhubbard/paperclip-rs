[workspace]
resolver = "2"
members = [
    "crates/paperclip-core",
    "crates/paperclip-runner",
    "crates/paperclip-runner/runner/crates/runner-core",
    "crates/paperclip-server",
    "crates/paperclip-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/paperclip-rs"
homepage = "https://github.com/bhubbard/paperclip-rs"
readme = "README.md"
keywords = ["paperclip", "ai-agents", "orchestration", "multi-agent", "governance"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace.dependencies]
paperclip-core = { path = "crates/paperclip-core" }
paperclip-runner = { path = "crates/paperclip-runner" }
paperclip-runner-core = { path = "crates/paperclip-runner/runner/crates/runner-core" }
paperclip-server = { path = "crates/paperclip-server" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
async-trait = "0.1"
tempfile = "3.17"

# Upstream runner-core dependencies
aes-gcm = "0.10"
aws-config = { version = "1.11", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-bedrockagentcore = { version = "1.63", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.112", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.112", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-smithy-types = "1.6"
aws-types = "1.3"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
jsonschema = { version = "0.50", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
rustix = { version = "1.1", features = ["fs"] }
sha1 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
toml_edit = "0.22"
